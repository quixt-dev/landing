# Deploys quixt.dev to Cloudflare Workers on every push to main (including merged pull requests).
# Can also be run by hand from the Actions tab ("Run workflow").
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   API token from the "Edit Cloudflare Workers" template, scoped to the quixt.dev zone
#   CLOUDFLARE_ACCOUNT_ID  902c2f52eda645a76a3cd1baf1c5ec68
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time: a push made during a deploy waits for it to finish, then deploys.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy to Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://quixt.dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npx astro check

      - name: Build
        run: npx astro build

      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
